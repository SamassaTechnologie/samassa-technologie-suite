<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock — SAMASSA TECHNOLOGIE</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-512x512.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"><style>
.stock-wrap{max-width:1180px;margin:78px auto 40px;padding:0 22px}.stock-head{background:linear-gradient(135deg,#0D1B2A,#006699);color:#fff;border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;gap:20px;align-items:center}.stock-head h1{font-size:22px;margin:0 0 5px}.stock-head p{margin:0;color:#B8D8EA;font-size:13px}.stock-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stock-kpi,.stock-card{background:#fff;border:1px solid #D0DDE8;border-radius:12px;box-shadow:0 2px 12px rgba(13,27,42,.08)}.stock-kpi{padding:15px}.stock-kpi strong{display:block;font-size:22px;color:#0D1B2A}.stock-kpi span{font-size:11px;color:#8099B0;text-transform:uppercase;font-weight:700}.stock-card{padding:18px;margin-bottom:16px}.stock-card h2{font-size:15px;margin:0 0 14px;color:#1A2D44}.stock-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end}.stock-form label{font-size:10px;color:#4A6080;font-weight:700;display:block;margin-bottom:4px}.stock-form input,.stock-form select{width:100%;padding:9px;border:1px solid #D0DDE8;border-radius:7px;font:inherit}.stock-btn{background:#0088CC;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}.stock-btn.out{background:#DC2626}.stock-table{width:100%;border-collapse:collapse}.stock-table th,.stock-table td{padding:10px 8px;border-bottom:1px solid #EEF3F7;text-align:left;font-size:12px}.stock-table th{background:#F0F5FA;color:#4A6080;font-size:10px;text-transform:uppercase}.low{color:#B45309;background:#FFFBEB;padding:3px 7px;border-radius:10px;font-weight:700}.ok{color:#15803D;background:#F0FDF4;padding:3px 7px;border-radius:10px;font-weight:700}.del{border:0;background:#FEE2E2;color:#B91C1C;border-radius:6px;padding:5px 8px;cursor:pointer}@media(max-width:800px){.stock-grid{grid-template-columns:1fr 1fr}.stock-form{grid-template-columns:1fr 1fr}.stock-head{display:block}.stock-head a{display:inline-block;margin-top:12px}}@media print{.topbar,.stock-form,.stock-head a{display:none}.stock-wrap{margin:0}.stock-card{box-shadow:none}}
</style></head><body><div class="topbar"><a href="index.html" class="back-link">← Retour</a><span class="topbar-title">📦 Gestion de stock</span><img src="logo.png" alt="Logo" class="topbar-logo"></div><main class="stock-wrap"><div class="stock-head"><div><h1>Stock matériel informatique</h1><p>Suivez vos ordinateurs, accessoires et pièces avec alertes de seuil.</p></div><a href="facture_materiel.html" class="btn" style="background:#16A34A;color:#fff;text-decoration:none">Nouvelle vente matériel →</a></div><div class="stock-grid"><div class="stock-kpi"><strong id="kProducts">0</strong><span>Références</span></div><div class="stock-kpi"><strong id="kUnits">0</strong><span>Unités en stock</span></div><div class="stock-kpi"><strong id="kValue">0 F</strong><span>Valeur estimée</span></div><div class="stock-kpi"><strong id="kLow">0</strong><span>Alertes stock</span></div></div><section class="stock-card"><h2>Ajouter une référence</h2><div class="stock-form"><div><label>Produit / référence</label><input id="name" placeholder="Ex. HP EliteBook 840 G8"></div><div><label>Catégorie</label><select id="category"><option>Ordinateur portable</option><option>Ordinateur bureau</option><option>Accessoire</option><option>Composant</option><option>Imprimante</option><option>Autre</option></select></div><div><label>Quantité</label><input id="qty" type="number" min="0" value="1"></div><div><label>Seuil alerte</label><input id="min" type="number" min="0" value="1"></div><div><label>Prix achat (FCFA)</label><input id="price" type="number" min="0" value="0"></div><button class="stock-btn" onclick="addStock()">Ajouter</button></div></section><section class="stock-card"><h2>Inventaire</h2><div style="overflow-x:auto"><table class="stock-table"><thead><tr><th>Produit</th><th>Catégorie</th><th>Qté</th><th>Seuil</th><th>Prix achat</th><th>Valeur</th><th>État</th><th></th></tr></thead><tbody id="stockBody"></tbody></table></div></section></main><script src="auth.js"></script><script src="stock.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
